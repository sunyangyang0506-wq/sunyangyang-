name: validate-skills
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skills.py
      - run: python scripts/eval_golden.py --validate-only
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/package_release.py --output /tmp/skill-dist
      - run: python scripts/skill_stats.py
