name: validate-skills
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - run: make check
      - run: python scripts/package_release.py --output /tmp/skill-dist
      - run: python scripts/skill_stats.py
